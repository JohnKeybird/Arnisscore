
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Tournament Bracket | ArnisScore</title>
    <link rel="stylesheet" href="bracket.css">
</head>

<body>

    <div class="bracket-container">

        <a href="index.html" class="back-button universal-back">
            ← BACK
        </a>

        <h1>CREATE TOURNAMENT</h1>
        <p>Set up your tournament and generate a single-elimination bracket.</p>

        <label for="participant-count">Number of Participants</label>
        <input
            type="number"
            id="participant-count"
            min="2"
            max="64"
            placeholder="Enter participant count"
        >

        <button id="continue-button">CONTINUE</button>

    </div>

    <script src="bracket.js"></script>
    <script src="universal-back.js"></script>

</body>
</html>
